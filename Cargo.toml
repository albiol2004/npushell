[package]
name = "npushell"
version = "0.1.0"
edition = "2021"
description = "NPU-powered shell copilot"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
clap_complete = "4"
